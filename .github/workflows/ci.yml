name: Zorro Evidence Lab CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plans, simulation, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned datasets
        run: bash scripts/prepare-data.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate configurations
        run: |
          python -m crimino_flipper.cli --config config/pilot.json show-plan
          python -m crimino_flipper.cli --config config/pilot-gitlab.json show-plan
          python -m crimino_flipper.cli --config config/main.json show-plan
      - name: Run offline pilot simulation twice
        run: |
          python -m crimino_flipper.cli --config config/pilot.json build-manifest
          python -m crimino_flipper.cli --config config/pilot.json simulate
          python -m crimino_flipper.cli --config config/pilot.json simulate
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-validation-results
          path: |
            pilot/manifest.public.json
            pilot/artifacts/simulation/run_summary.json
            pilot/artifacts/simulation/results_summary.md
            pilot/artifacts/simulation/run_status.json
          if-no-files-found: ignore

  container:
    name: Validate Docker image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned datasets
        run: bash scripts/prepare-data.sh
      - name: Build image
        run: docker build --tag zorro-evidence-lab:ci .
      - name: Check container plans
        run: |
          docker run --rm zorro-evidence-lab:ci python -m crimino_flipper.cli --config config/pilot.json show-plan
          docker run --rm zorro-evidence-lab:ci python -m crimino_flipper.cli --config config/pilot-gitlab.json show-plan
          docker run --rm zorro-evidence-lab:ci python -m crimino_flipper.cli --config config/main.json show-plan
      - name: Run container tests
        run: docker run --rm zorro-evidence-lab:ci python -m unittest discover -s tests -v
