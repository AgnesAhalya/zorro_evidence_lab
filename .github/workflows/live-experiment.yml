name: Zorro Evidence Lab Live Experiment

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Choose the OpenRouter pilot/main or Adaption run"
        required: true
        type: choice
        options:
          - pilot
          - pilot-openrouter
          - main
          - main-openrouter
      allow_paid_calls:
        description: "Explicitly authorize paid provider calls"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    name: Run ${{ inputs.scope }} experiment
    if: ${{ inputs.allow_paid_calls == true && inputs.scope != 'pilot-openrouter' && inputs.scope != 'main-openrouter' }}
    runs-on: ubuntu-latest
    # GitHub-hosted runners have a hard six-hour job limit.
    timeout-minutes: 360
    environment: ${{ inputs.scope }}
    env:
      ADAPTION_API_KEY: ${{ secrets.ADAPTION_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned datasets
        run: bash scripts/prepare-data.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install live dependencies
        run: python -m pip install -e '.[live,openrouter]'
      - name: Run selected live experiment
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.scope }}" == "pilot" ]]; then
            config="config/pilot.json"
            public_manifest="pilot/manifest.github.pilot.public.json"
            private_manifest="pilot/manifest.github.pilot.private.json"
            artifacts="pilot/artifacts/adaption/github-pilot"
          elif [[ "${{ inputs.scope }}" == "pilot-openrouter" ]]; then
            config="config/pilot-openrouter.json"
            public_manifest="pilot/manifest.github.pilot-openrouter.public.json"
            private_manifest="pilot/manifest.github.pilot-openrouter.private.json"
            artifacts="pilot/artifacts/openrouter/github-pilot-openrouter-v3"
          elif [[ "${{ inputs.scope }}" == "main" ]]; then
            config="config/main.json"
            public_manifest="pilot/manifest.github.main.public.json"
            private_manifest="pilot/manifest.github.main.private.json"
            artifacts="pilot/artifacts/adaption/github-main"
          else
            config="config/main-openrouter.json"
            public_manifest="pilot/manifest.github.main-openrouter.public.json"
            private_manifest="pilot/manifest.github.main-openrouter.private.json"
            artifacts="pilot/artifacts/openrouter/github-main-openrouter-v3"
          fi
          python -m crimino_flipper.cli --config "$config" show-plan
          python -m crimino_flipper.cli --config "$config" build-manifest \
            --public "$public_manifest" --private "$private_manifest"
          python -m crimino_flipper.cli --config "$config" run-live \
            --manifest "$private_manifest" --artifacts "$artifacts" --allow-paid-calls
      - name: Upload live results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-live-${{ inputs.scope }}
          path: |
            pilot/manifest.github.*.public.json
            pilot/artifacts/**/run_summary.json
            pilot/artifacts/**/results_summary.md
            pilot/artifacts/**/run_status.json
            pilot/artifacts/**/analysis_text/
          if-no-files-found: ignore

  live-openrouter-sharded:
    name: Run ${{ inputs.scope }} shard ${{ matrix.shard_index }}
    if: ${{ inputs.allow_paid_calls == true && (inputs.scope == 'pilot-openrouter' || inputs.scope == 'main-openrouter') }}
    runs-on: ubuntu-latest
    # GitHub-hosted runners have a hard six-hour job limit.
    timeout-minutes: 360
    environment: ${{ inputs.scope }}
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4]
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned datasets
        run: bash scripts/prepare-data.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Install live dependencies
        run: python -m pip install -e '.[live,openrouter]'
      - name: Run OpenRouter shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.scope }}" == "pilot-openrouter" ]]; then
            config="config/pilot-openrouter.json"
            prefix="pilot-openrouter"
            artifacts="pilot/artifacts/openrouter/github-pilot-openrouter-v4/shard-${SHARD_INDEX}"
          else
            config="config/main-openrouter.json"
            prefix="main-openrouter"
            artifacts="pilot/artifacts/openrouter/github-main-openrouter-v4/shard-${SHARD_INDEX}"
          fi
          public_manifest="pilot/manifest.github.${prefix}.shard-${SHARD_INDEX}.public.json"
          private_manifest="pilot/manifest.github.${prefix}.shard-${SHARD_INDEX}.private.json"
          python -m crimino_flipper.cli --config "$config" show-plan \
            --shard-index "$SHARD_INDEX" --shard-count 5
          python -m crimino_flipper.cli --config "$config" build-manifest \
            --public "$public_manifest" --private "$private_manifest" \
            --shard-index "$SHARD_INDEX" --shard-count 5
          python -m crimino_flipper.cli --config "$config" run-live \
            --manifest "$private_manifest" --artifacts "$artifacts" \
            --shard-index "$SHARD_INDEX" --shard-count 5 --allow-paid-calls
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-live-${{ inputs.scope }}-shard-${{ matrix.shard_index }}
          path: |
            pilot/manifest.github.*.shard-${{ matrix.shard_index }}.*.json
            pilot/artifacts/**/run_summary.json
            pilot/artifacts/**/results_summary.md
            pilot/artifacts/**/run_status.json
            pilot/artifacts/**/analysis_text/
          if-no-files-found: ignore

  merge-openrouter-shards:
    name: Merge ${{ inputs.scope }} shards
    needs: live-openrouter-sharded
    if: ${{ always() && needs.live-openrouter-sharded.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: github-live-${{ inputs.scope }}-shard-*
          # Keep each artifact in its own directory so same-named files from
          # different shards cannot overwrite one another.
          merge-multiple: false
          path: shard-results
      - name: Merge shard summaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.scope }}" == "pilot-openrouter" ]]; then
            config="config/pilot-openrouter.json"
          else
            config="config/main-openrouter.json"
          fi
          python scripts/merge-sharded-results.py \
            --config "$config" \
            --summary-root shard-results \
            --output-dir merged-results
      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: github-live-${{ inputs.scope }}-merged
          path: merged-results/
