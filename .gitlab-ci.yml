stages:
  - validate
  - container
  - publish
  - experiment

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  PYTHONUNBUFFERED: "1"

cache:
  paths:
    - .cache/pip

pilot-validation:
  stage: validate
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git bash
    - bash scripts/prepare-data.sh
    - python -m pip install --upgrade pip
    - python -m pip install -e .
  script:
    - python -m crimino_flipper.cli --config config/pilot-gitlab.json show-plan
    - python -m crimino_flipper.cli --config config/pilot-gitlab.json build-manifest
    - python -m crimino_flipper.cli --config config/pilot-gitlab.json simulate
    - python -m crimino_flipper.cli --config config/pilot-gitlab.json simulate
    - python -m unittest discover -s tests -v
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - pilot/manifest.public.json
      - pilot/artifacts/simulation/run_summary.json
      - pilot/artifacts/simulation/run_status.json

main-plan-validation:
  stage: validate
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git bash
    - bash scripts/prepare-data.sh
    - python -m pip install --upgrade pip
    - python -m pip install -e .
  script:
    - python -m crimino_flipper.cli --config config/main.json show-plan
    - python -m crimino_flipper.cli --config config/main.json build-manifest --public pilot/manifest.main.public.json --private pilot/manifest.main.private.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - pilot/manifest.main.public.json

container-validation:
  stage: container
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - apk add --no-cache bash git
    - bash scripts/prepare-data.sh
    - docker build --pull --tag "$DOCKER_IMAGE_SHA" .
    - docker run --rm "$DOCKER_IMAGE_SHA" python -m crimino_flipper.cli --config config/pilot.json show-plan
    - docker run --rm "$DOCKER_IMAGE_SHA" python -m crimino_flipper.cli --config config/pilot-gitlab.json show-plan
    - docker run --rm "$DOCKER_IMAGE_SHA" python -m crimino_flipper.cli --config config/main.json show-plan
    - docker run --rm "$DOCKER_IMAGE_SHA" python -m unittest discover -s tests -v

publish-container:
  stage: publish
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull --tag "$DOCKER_IMAGE_SHA" .
    - docker push "$DOCKER_IMAGE_SHA"
    - docker tag "$DOCKER_IMAGE_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pilot-live:
  stage: experiment
  image: python:3.12-slim
  when: manual
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git bash
    - bash scripts/prepare-data.sh
    - python -m pip install --upgrade pip
    - python -m pip install -e '.[live]'
  script:
    - python -m crimino_flipper.cli --config config/pilot-gitlab.json show-plan
    - python -m crimino_flipper.cli --config config/pilot-gitlab.json build-manifest --public pilot/manifest.pilot.public.json --private pilot/manifest.pilot.private.json
    - python -m crimino_flipper.cli --config config/pilot-gitlab.json run-live --manifest pilot/manifest.pilot.private.json --artifacts pilot/artifacts/adaption/pilot --allow-paid-calls
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - pilot/manifest.pilot.public.json
      - pilot/artifacts/adaption/pilot/

main-live:
  stage: experiment
  image: python:3.12-slim
  when: manual
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git bash
    - bash scripts/prepare-data.sh
    - python -m pip install --upgrade pip
    - python -m pip install -e '.[live]'
  script:
    - python -m crimino_flipper.cli --config config/main.json show-plan
    - python -m crimino_flipper.cli --config config/main.json build-manifest --public pilot/manifest.main.public.json --private pilot/manifest.main.private.json
    - python -m crimino_flipper.cli --config config/main.json run-live --manifest pilot/manifest.main.private.json --artifacts pilot/artifacts/adaption/main --allow-paid-calls
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - pilot/manifest.main.public.json
      - pilot/artifacts/adaption/main/
